name: Build and Publish Releases

# Triggered by a tag push. ci.yml's `auto-tag` job creates the tag and nothing
# else; this workflow is the only place that publishes a GitHub Release, which
# removes the double-release race the two workflows used to have.
#
# The release is published with the first-party `gh` CLI (preinstalled on
# runners) instead of a third-party action: nothing to SHA-pin, and full control
# over notes, checksums and the prerelease flag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release halfway through.
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  build-binaries:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pengu-windows-x64.zip
            target_os: windows
          - os: ubuntu-latest
            artifact_name: pengu-linux-x64.tar.gz
            target_os: linux
          - os: macos-latest
            artifact_name: pengu-macos.tar.gz
            target_os: macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stage TinyCC (Linux/macOS, from source)
        if: runner.os != 'Windows'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from pengu_tcc import ensure_tcc
          path = ensure_tcc("build/tcc-dist", verbose=True)
          print("tcc:", path)
          if not path:
              print("::warning::TinyCC could not be built; the release will fall back to gcc/clang")
          PY

      # TinyCC ships no official Windows binary.  The download is best-effort but
      # *verified*: PENGU_TCC_SHA256 (or the default digest below) must match, so
      # a compromised mirror cannot inject a binary into the release.
      - name: Stage TinyCC (Windows, prebuilt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "build/tcc-dist"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $url = if ($env:PENGU_TCC_URL) { $env:PENGU_TCC_URL } else { "https://github.com/FitzRoyX/tinycc/releases/download/tcc_20221020/tcc_20221020.zip" }
          $expected = $env:PENGU_TCC_SHA256
          try {
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\tcc.zip"
          } catch {
            Write-Host "::warning::TinyCC download failed ($url); the Windows release will use the system compiler"
            exit 0
          }
          $actual = (Get-FileHash -Algorithm SHA256 "$env:TEMP\tcc.zip").Hash.ToLower()
          if ($expected -and ($actual -ne $expected.ToLower())) {
            Write-Host "::error::TinyCC SHA-256 mismatch ($actual != $expected); refusing to bundle it"
            exit 1
          }
          if (-not $expected) {
            Write-Host "::notice::TinyCC digest $actual (set PENGU_TCC_SHA256 to enforce it)"
          }
          Expand-Archive -Path "$env:TEMP\tcc.zip" -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Recurse -Filter tcc.exe | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "$dest\tcc.exe" -Force
            Write-Host "staged $($exe.FullName)"
            # TCC looks for its own headers next to the executable: without this
            # the bundled 'tcc/tcc.exe' cannot compile anything (the toolchain
            # would silently fall back to the system compiler).
            $inc = Get-ChildItem -Path $exe.Directory -Recurse -Filter stdarg.h -ErrorAction SilentlyContinue |
                   Where-Object { $_.Directory.Name -eq 'include' } | Select-Object -First 1
            if (-not $inc) {
              $inc = Get-ChildItem -Path $dest -Recurse -Filter stdarg.h -ErrorAction SilentlyContinue |
                     Where-Object { $_.Directory.Name -eq 'include' } | Select-Object -First 1
            }
            if ($inc) {
              if (Test-Path "$dest\include") { Remove-Item "$dest\include" -Recurse -Force }
              Copy-Item $inc.Directory.FullName "$dest\include" -Recurse -Force
              Write-Host "staged include tree from $($inc.Directory.FullName)"
            } else {
              Write-Host "::warning::TCC headers (stdarg.h) not found; the bundled tcc may not compile"
            }
          } else {
            Write-Host "::warning::tcc.exe not found in the downloaded archive"
          }

      - name: Toolchain smoke test (run + cache + doctor)
        run: |
          python scripts/smoke.py

      - name: Run Test Suite
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Run Automated Release Packager
        run: |
          python make_release.py

      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        run: |
          # Gatekeeper refuses to execute unsigned Mach-O binaries. PyInstaller
          # ad-hoc signs the files it embeds; sign the produced entry point (and
          # any loose TCC binary) too so the archive runs out of the box.
          find pengucc_build -type f \( -name pengu -o -name tcc \) -print0 2>/dev/null \
            | while IFS= read -r -d '' t; do
                echo "codesign --sign - --force $t"
                codesign --sign - --force "$t" || true
              done
          { codesign --verify --verbose pengucc_build/bin/pengu \
            || codesign --verify --verbose pengucc_build/pengu; } 2>/dev/null \
            || echo "::warning::could not verify the signature (release still published)"

      - name: Archive Distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "pengucc_build/*" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Archive Distribution (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf "${{ matrix.artifact_name }}" -C pengucc_build .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target_os }}-release
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 30

  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Built once: the VSIX is platform independent (previously uploaded three
      # times, once per OS of the build matrix).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci
          npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [ build-binaries, vscode-extension ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # workflow_dispatch runs do not have a tag ref, so the tag has to come from
      # the input. It must already exist: this workflow publishes, it does not tag.
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag '$TAG' does not exist. Push the tag first (ci.yml creates it)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          python scripts/release_version.py \
            --notes-file release_notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Check the changelog matches the tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.release.outputs.version }}"
          CL_VERSION="$(python scripts/release_version.py)"
          if [ "v${TAG_VERSION}" != "${CL_VERSION}" ]; then
            echo "::error::tag v${TAG_VERSION} does not match the first released CHANGELOG entry (${CL_VERSION})"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Collect assets and write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-assets
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.vsix" \) \
            -exec cp {} final-assets/ \;
          count="$(find final-assets/ -type f | wc -l | tr -d ' ')"
          if [ "$count" -lt 3 ]; then
            echo "::error::expected at least 3 release assets (2 archives + 1 VSIX), found $count"
            ls -lah final-assets/ || true
            exit 1
          fi
          # Publish checksums so a download can be verified without trusting TLS.
          ( cd final-assets && sha256sum ./* > SHA256SUMS.txt )
          ls -lah final-assets/
          cat final-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          ARGS=(--title "${{ steps.changelog.outputs.title }}"
                --notes-file release_notes.md
                --verify-tag)
          if [ "${{ steps.changelog.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
            echo "Publishing $TAG as a prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" final-assets/* "${ARGS[@]}"
