name: Build and Publish Releases

# Triggered by a tag push **or** by an explicit `workflow_dispatch` from ci.yml's
# `auto-tag` job.  The dispatch exists because GitHub does not start a workflow
# run for a push made with the repository's GITHUB_TOKEN, so the tag push alone
# never handed over (Phase 9, item 9.6).  ci.yml's `auto-tag` job creates the tag
# and nothing else; this workflow is the only place that publishes a GitHub
# Release, which removes the double-release race the two workflows used to have.
#
# The release is published with the first-party `gh` CLI (preinstalled on
# runners) instead of a third-party action: nothing to SHA-pin, and full control
# over notes, checksums and the prerelease flag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release halfway through.
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  build-binaries:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pengu-windows-x64.zip
            target_os: windows
          - os: ubuntu-latest
            artifact_name: pengu-linux-x64.tar.gz
            target_os: linux
          - os: macos-latest
            artifact_name: pengu-macos.tar.gz
            target_os: macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Stage TinyCC (Linux/macOS, from source)
        if: runner.os != 'Windows'
        run: |
          python pengu_tcc.py --stage build/tcc-dist --allow-missing

      # TinyCC ships no official Windows binary.  The download is best-effort
      # about *availability* and strict about *integrity*: the archive must hash
      # to `pengu_tcc.TCC_RELEASE_SHA256` (override with PENGU_TCC_SHA256 only
      # together with PENGU_TCC_URL) or the job fails.  The digest and the check
      # live in pengu_tcc.py, not here, so every caller verifies the same bytes
      # (Phase 9, items 9.2/9.3): a workflow-local `::notice::` was exactly the
      # "no gate at all" the audit refuted.
      - name: Stage TinyCC (Windows, prebuilt, digest verified)
        if: runner.os == 'Windows'
        run: |
          python pengu_tcc.py --stage build/tcc-dist --allow-missing

      - name: Toolchain smoke test (run + cache + doctor)
        run: |
          python scripts/smoke.py

      - name: Run Test Suite
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Run Automated Release Packager
        run: |
          python make_release.py

      # macOS, item 9.9: ad-hoc signing only. There is no Apple developer
      # account, so there is no `notarytool` step and this release does NOT claim
      # to pass `spctl --assess` (Gatekeeper still refuses a quarantined,
      # un-notarized download). What is gated here is that the signature is
      # *valid*: it used to be `|| true`, i.e. a warning that could not fail.
      - name: Ad-hoc code sign and verify (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # PyInstaller ad-hoc signs the files it embeds; sign the produced entry
          # point (and any loose TCC binary) too. No --deep, no timestamp, no
          # entitlements: an ad-hoc signature is the strongest thing available.
          find pengucc_build -type f \( -name pengu -o -name tcc \) -print0 2>/dev/null \
            | while IFS= read -r -d '' t; do
                echo "codesign --sign - --force $t"
                codesign --sign - --force "$t"
              done
          BIN="pengucc_build/pengu"
          [ -f "$BIN" ] || BIN="pengucc_build/bin/pengu"
          test -f "$BIN" || { echo "::error::no pengu binary to sign"; exit 1; }
          codesign --verify --strict --verbose=2 "$BIN"
          echo "ad-hoc signature valid: $BIN"
          # Recorded, not gated: this is expected to fail without notarization.
          echo "--- spctl --assess (expected to fail: not notarized) ---"
          spctl --assess --type execute -vv "$BIN" || true

      # Deterministic archive (Phase 9, item 9.8): make_release.py writes sorted
      # entries with a constant mtime from SOURCE_DATE_EPOCH. `tar -czf` and
      # `Compress-Archive` embedded the build time, so two builds of the same
      # commit never hashed the same.
      - name: Archive Distribution
        run: |
          python make_release.py --archive-only \
            --dist-dir pengucc_build --archive "${{ matrix.artifact_name }}"

      - name: Reproducibility check (same commit, same bytes)
        shell: bash
        run: |
          set -euo pipefail
          python make_release.py --archive-only \
            --dist-dir pengucc_build --archive "reproducibility-check${{ matrix.artifact_name }}"
          A=$(sha256sum "${{ matrix.artifact_name }}" | cut -d' ' -f1)
          B=$(sha256sum "reproducibility-check${{ matrix.artifact_name }}" | cut -d' ' -f1)
          echo "run 1: $A"
          echo "run 2: $B"
          if [ "$A" != "$B" ]; then
            echo "::error::make_release.py is not reproducible: $A != $B"
            exit 1
          fi
          rm -f "reproducibility-check${{ matrix.artifact_name }}"
          echo "reproducible archive: $A"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target_os }}-release
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 30

  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Built once: the VSIX is platform independent (previously uploaded three
      # times, once per OS of the build matrix).
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci
          npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [ build-binaries, vscode-extension ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      # Dispatching release-verify.yml (item 9.7) needs actions: write.
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      # workflow_dispatch runs do not have a tag ref, so the tag has to come from
      # the input. It must already exist: this workflow publishes, it does not tag.
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag '$TAG' does not exist. Push the tag first (ci.yml creates it)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          python scripts/release_version.py \
            --notes-file release_notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Check the changelog matches the tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.release.outputs.version }}"
          CL_VERSION="$(python scripts/release_version.py)"
          if [ "v${TAG_VERSION}" != "${CL_VERSION}" ]; then
            echo "::error::tag v${TAG_VERSION} does not match the first released CHANGELOG entry (${CL_VERSION})"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets
          merge-multiple: true

      - name: Collect assets and write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-assets
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.vsix" \) \
            -exec cp {} final-assets/ \;
          count="$(find final-assets/ -type f | wc -l | tr -d ' ')"
          if [ "$count" -lt 3 ]; then
            echo "::error::expected at least 3 release assets (2 archives + 1 VSIX), found $count"
            ls -lah final-assets/ || true
            exit 1
          fi
          # Publish checksums so a download can be verified without trusting TLS.
          ( cd final-assets && sha256sum ./* > SHA256SUMS.txt )
          ls -lah final-assets/
          cat final-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          ARGS=(--title "${{ steps.changelog.outputs.title }}"
                --notes-file release_notes.md
                --verify-tag)
          if [ "${{ steps.changelog.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
            echo "Publishing $TAG as a prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" final-assets/* "${ARGS[@]}"

      # The last gate (Phase 9, item 9.7): download what was just published and
      # execute it.  It is dispatched explicitly because a `release` event
      # created with GITHUB_TOKEN does not start a workflow run either (the same
      # restriction as the tag handoff, item 9.6).  `actions: write` is what lets
      # this job start another run.
      - name: Dispatch release-verify for the published tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          echo "dispatching release-verify.yml for $TAG"
          gh workflow run release-verify.yml --ref "${GITHUB_REF_NAME}" -f tag="$TAG"
