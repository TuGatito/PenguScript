name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.8.4)'
        required: false
        default: 'v0.8.4'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pengu-windows-x64.zip
            target_os: windows
          - os: ubuntu-latest
            artifact_name: pengu-linux-x64.tar.gz
            target_os: linux
          - os: macos-latest
            artifact_name: pengu-macos.tar.gz
            target_os: macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'vscode-extension/package-lock.json'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gcc \
            zlib1g-dev libpcre2-dev libxml2-dev libcurl4-openssl-dev \
            libmbedtls-dev libmicrohttpd-dev libsqlite3-dev libssl-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl1-mesa-dev

      - name: Install macOS Build Dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config curl pcre2 libmicrohttpd mbedtls libxml2 || true
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix pcre2)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libmicrohttpd)/lib/pkgconfig:$(brew --prefix mbedtls)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build C Runtime & Dependencies
        run: |
          python build_runtime.py

      - name: Stage TinyCC (Linux/macOS, from source)
        if: runner.os != 'Windows'
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          from pengu_tcc import ensure_tcc
          path = ensure_tcc("build/tcc-dist", verbose=True)
          print("tcc:", path)
          if not path:
              print("::warning::TinyCC could not be built; the release will fall back to gcc/clang")
          PY

      - name: Stage TinyCC (Windows, prebuilt)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = "build/tcc-dist"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # TinyCC publishes no official Windows binary; this is the widely used
          # prebuilt package. Override with PENGU_TCC_URL when a mirror is needed.
          $url = if ($env:PENGU_TCC_URL) { $env:PENGU_TCC_URL } else { "https://github.com/FitzRoyX/tinycc/releases/download/tcc_20221020/tcc_20221020.zip" }
          try {
            Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\tcc.zip"
            Expand-Archive -Path "$env:TEMP\tcc.zip" -DestinationPath $dest -Force
          } catch {
            Write-Host "::warning::TinyCC download failed ($url); the Windows release will use the system compiler"
            exit 0
          }
          $exe = Get-ChildItem -Path $dest -Recurse -Filter tcc.exe | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName "$dest\tcc.exe" -Force
            Write-Host "staged $($exe.FullName)"
            # TCC looks for its own headers next to the executable: without this
            # the bundled 'tcc/tcc.exe' cannot compile anything (the toolchain
            # would silently fall back to the system compiler).
            $inc = Get-ChildItem -Path $exe.Directory -Recurse -Filter stdarg.h -ErrorAction SilentlyContinue |
                   Where-Object { $_.Directory.Name -eq 'include' } | Select-Object -First 1
            if (-not $inc) {
              $inc = Get-ChildItem -Path $dest -Recurse -Filter stdarg.h -ErrorAction SilentlyContinue |
                     Where-Object { $_.Directory.Name -eq 'include' } | Select-Object -First 1
            }
            if ($inc) {
              if (Test-Path "$dest\include") { Remove-Item "$dest\include" -Recurse -Force }
              Copy-Item $inc.Directory.FullName "$dest\include" -Recurse -Force
              Write-Host "staged include tree from $($inc.Directory.FullName)"
            } else {
              Write-Host "::warning::TCC headers (stdarg.h) not found; the bundled tcc may not compile"
            }
          } else {
            Write-Host "::warning::tcc.exe not found in the downloaded archive"
          }

      - name: Toolchain smoke test (run + cache + doctor)
        run: |
          python scripts/smoke.py

      - name: Run Test Suite
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Run Automated Release Packager
        run: |
          python make_release.py

      - name: Ad-hoc code sign (macOS)
        if: runner.os == 'macOS'
        run: |
          # Gatekeeper refuses to execute unsigned Mach-O binaries. PyInstaller
          # ad-hoc signs the files it embeds; sign the produced entry point (and
          # any loose TCC binary) too so the archive runs out of the box.
          find pengucc_build -type f \( -name pengu -o -name tcc \) -print0 2>/dev/null \
            | while IFS= read -r -d '' t; do
                echo "codesign --sign - --force $t"
                codesign --sign - --force "$t" || true
              done
          { codesign --verify --verbose pengucc_build/bin/pengu \
            || codesign --verify --verbose pengucc_build/pengu; } 2>/dev/null \
            || echo "::warning::could not verify the signature (release still published)"

      - name: Archive Distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "pengucc_build/*" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Archive Distribution (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf "${{ matrix.artifact_name }}" -C pengucc_build .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_os }}-release
          path: ${{ matrix.artifact_name }}

      - name: Upload VS Code Extension VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.target_os }}
          path: vscode-extension/*.vsix
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize Release Files
        run: |
          mkdir -p final-assets
          find release-assets/ -type f -name "*.zip" -exec cp {} final-assets/ \;
          find release-assets/ -type f -name "*.tar.gz" -exec cp {} final-assets/ \;
          find release-assets/ -type f -name "*.vsix" -exec cp {} final-assets/ \;
          ls -lah final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
