name: Release

# Triggered from:
#   1. a `push` of a `v*` tag (manual flow or reruns);
#   2. a `workflow_dispatch` sent by ci.yml's `auto-tag` job with
#      `version=vX.Y.Z`.
#
# It publishes the GitHub Release with the CHANGELOG section as the notes,
# uploads the Linux/Windows/macOS binaries plus the VSIX, writes SHA256SUMS.txt
# and — as the final job of this same workflow — downloads the *published*
# artifact, installs it (portable layout and a real FHS prefix) and executes it.
# Verification used to be a separate `release-verify.yml` dispatched by hand;
# folding it in removes a second workflow and the dispatch it needed, while
# keeping the ordering guarantee (`verify` needs the publish job).
#
# The hand-off from ci.yml is an explicit `workflow_dispatch`: GitHub does not
# start a workflow run from a push made with GITHUB_TOKEN.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish (e.g. v1.0.0). Must already exist.'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release halfway through.
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  # ----------------------------------------------------------------------
  # Builds the release on all three platforms, runs the suite, signs the macOS
  # entry point ad-hoc, archives deterministically and uploads one artifact
  # per OS.
  # ----------------------------------------------------------------------
  build-binaries:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pengu-windows-x64.zip
            target_os: windows
          - os: ubuntu-latest
            artifact_name: pengu-linux-x64.tar.gz
            target_os: linux
          - os: macos-latest
            artifact_name: pengu-macos.tar.gz
            target_os: macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # TinyCC ships no official Windows binary.  The download is best-effort
      # about *availability* and strict about *integrity*: the archive must hash
      # to `pengu_tcc.TCC_RELEASE_SHA256` (override with PENGU_TCC_SHA256 only
      # together with PENGU_TCC_URL) or the job fails.  The digest and the check
      # live in pengu_tcc.py, not here, so every caller verifies the same bytes
      # (Phase 9, items 9.2/9.3).
      - name: Stage TinyCC
        run: |
          python pengu_tcc.py --stage build/tcc-dist --allow-missing

      - name: Toolchain smoke test (run + cache + doctor)
        run: |
          python scripts/smoke.py

      - name: Run Test Suite
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Run Automated Release Packager
        run: |
          python make_release.py

      # macOS, item 9.9: ad-hoc signing only. There is no Apple developer
      # account, so there is no `notarytool` step and this release does NOT
      # claim to pass `spctl --assess`. What is gated is that the signature is
      # *valid*: it used to be `|| true`, i.e. a warning that could not fail.
      - name: Ad-hoc code sign and verify (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          find pengucc_build -type f \( -name pengu -o -name tcc \) -print0 2>/dev/null \
            | while IFS= read -r -d '' t; do
                echo "codesign --sign - --force $t"
                codesign --sign - --force "$t"
              done
          BIN="pengucc_build/pengu"
          [ -f "$BIN" ] || BIN="pengucc_build/bin/pengu"
          test -f "$BIN" || { echo "::error::no pengu binary to sign"; exit 1; }
          codesign --verify --strict --verbose=2 "$BIN"
          echo "ad-hoc signature valid: $BIN"
          # Recorded, not gated: this is expected to fail without notarization.
          echo "--- spctl --assess (expected to fail: not notarized) ---"
          spctl --assess --type execute -vv "$BIN" || true

      # Deterministic archive (Phase 9, item 9.8): make_release.py writes sorted
      # entries with a constant mtime from SOURCE_DATE_EPOCH.
      - name: Archive Distribution
        run: |
          python make_release.py --archive-only \
            --dist-dir pengucc_build --archive "${{ matrix.artifact_name }}"

      - name: Reproducibility check (same commit, same bytes)
        shell: bash
        run: |
          set -euo pipefail
          python make_release.py --archive-only \
            --dist-dir pengucc_build --archive "reproducibility-check${{ matrix.artifact_name }}"
          A=$(sha256sum "${{ matrix.artifact_name }}" | cut -d' ' -f1)
          B=$(sha256sum "reproducibility-check${{ matrix.artifact_name }}" | cut -d' ' -f1)
          echo "run 1: $A"
          echo "run 2: $B"
          if [ "$A" != "$B" ]; then
            echo "::error::make_release.py is not reproducible: $A != $B"
            exit 1
          fi
          rm -f "reproducibility-check${{ matrix.artifact_name }}"
          echo "reproducible archive: $A"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target_os }}-release
          path: ${{ matrix.artifact_name }}
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------------
  # VSIX: built once (the extension is platform independent).
  # ----------------------------------------------------------------------
  vscode-extension:
    name: Build VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci
          npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 30

  # ----------------------------------------------------------------------
  # Publishes the GitHub Release.  The notes come from CHANGELOG.md
  # (scripts/release_version.py --notes-file) and SHA256SUMS.txt is written
  # next to the assets.
  # ----------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release
    needs: [ build-binaries, vscode-extension ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # workflow_dispatch runs do not have a tag ref, so the tag has to come from
      # the input. It must already exist: this workflow publishes, it does not tag.
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::tag '$TAG' does not exist. Push the tag first (ci.yml creates it)."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: changelog
        run: |
          python scripts/release_version.py \
            --notes-file release_notes.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Check the changelog matches the tag
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.release.outputs.version }}"
          CL_VERSION="$(python scripts/release_version.py)"
          if [ "v${TAG_VERSION}" != "${CL_VERSION}" ]; then
            echo "::error::tag v${TAG_VERSION} does not match the first released CHANGELOG entry (${CL_VERSION})"
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Collect assets and write SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-assets
          find release-assets/ -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.vsix" \) \
            -exec cp {} final-assets/ \;
          count="$(find final-assets/ -type f | wc -l | tr -d ' ')"
          if [ "$count" -lt 3 ]; then
            echo "::error::expected at least 3 release assets (2 archives + 1 VSIX), found $count"
            ls -lah final-assets/ || true
            exit 1
          fi
          # Publish checksums so a download can be verified without trusting TLS.
          ( cd final-assets && sha256sum ./* > SHA256SUMS.txt )
          ls -lah final-assets/
          cat final-assets/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.release.outputs.tag }}"
          ARGS=(--title "${{ steps.changelog.outputs.title }}"
                --notes-file release_notes.md
                --verify-tag)
          if [ "${{ steps.changelog.outputs.prerelease }}" = "true" ]; then
            ARGS+=(--prerelease)
            echo "Publishing $TAG as a prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$TAG" final-assets/* "${ARGS[@]}"

  # ----------------------------------------------------------------------
  # The last gate (items 9.7 and 9.12): download each *published* artifact and
  # execute it.  Nothing here inspects a file: `pengu -V`, `pengu build` and
  # `pengu run` are executed, and the FHS run also proves the prefix is what
  # made the build work by hiding <prefix>/lib/pengu and requiring the
  # documented failure.  A failure here is the signal to withdraw the release:
  # see docs/RELEASE.md "If verification fails".
  # ----------------------------------------------------------------------
  verify:
    name: Verify ${{ matrix.label }}
    needs: [ publish-release ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: pengu-linux-x64.tar.gz
            layout: portable
            label: linux-x64 portable
          - os: ubuntu-latest
            artifact: pengu-linux-x64.tar.gz
            layout: fhs
            label: linux-x64 fhs prefix
          - os: macos-latest
            artifact: pengu-macos.tar.gz
            layout: portable
            label: macos portable
          - os: macos-latest
            artifact: pengu-macos.tar.gz
            layout: fhs
            label: macos fhs prefix
          - os: windows-latest
            artifact: pengu-windows-x64.zip
            layout: portable
            label: windows-x64 portable

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Resolve the published tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::not a release tag: '$TAG'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Download the published artifact
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.release.outputs.tag }}" \
            --pattern "${{ matrix.artifact }}" --dir dist --clobber
          ls -la dist/
          test -s "dist/${{ matrix.artifact }}"

      - name: Verify the artifact end-to-end (${{ matrix.layout }})
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_artifact.py \
            --artifact "dist/${{ matrix.artifact }}" \
            --layout "${{ matrix.layout }}" \
            --expected-version "${{ steps.release.outputs.version }}" \
            --check-signature \
            --workdir "$RUNNER_TEMP/pengu-verify-${{ matrix.layout }}"
