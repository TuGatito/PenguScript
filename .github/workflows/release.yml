name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap PSC
        uses: ./.github/actions/setup-psc-bootstrap
        with:
          version: "0.10.0"

      - name: Build compiler
        run: |
          set -euo pipefail
          psc build .
          ./build/psc version
          ./tools/build_runtime.sh

      - name: Package portable/FHS
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" \
          PENGU_BIND="$PENGU_HOME/bin/pengu-bind" \
          tools/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pengu-release
          path: dist/*
