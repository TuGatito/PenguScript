name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap compiler
        id: bootstrap
        uses: ./.github/actions/setup-psc-bootstrap

      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          case "$PENGU_COMPILER_NAME" in
            psc|psc.exe)
              "$PENGU_COMPILER" build .
              ;;
            *)
              # Legacy releases ship `pengu`, which resolves the project from
              # the working directory instead of taking a path argument.
              "$PENGU_COMPILER" build
              ;;
          esac
          ./build/psc version
          ./tools/build_runtime.sh

      - name: Package portable/FHS
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" \
          PENGU_BIND="${PENGU_BIND:-build/pengu-bind}" \
          tools/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pengu-release
          path: dist/*
