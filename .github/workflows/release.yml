name: Build and Publish Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.6.0)'
        required: false
        default: 'v0.6.0'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Standalone on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pengu-windows-x64.zip
            target_os: windows
          - os: ubuntu-latest
            artifact_name: pengu-linux-x64.tar.gz
            target_os: linux
          - os: macos-latest
            artifact_name: pengu-macos-x64.tar.gz
            target_os: macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Release Packager
        run: |
          python make_release.py

      - name: Archive Distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "pengucc_build/*" -DestinationPath "${{ matrix.artifact_name }}"

      - name: Archive Distribution (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf "${{ matrix.artifact_name }}" -C pengucc_build .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_os }}-release
          path: ${{ matrix.artifact_name }}

      - name: Upload VS Code Extension VSIX
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: pengucc_build/*.vsix

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize Release Files
        run: |
          mkdir -p final-assets
          find release-assets/ -type f -name "*.zip" -exec cp {} final-assets/ \;
          find release-assets/ -type f -name "*.tar.gz" -exec cp {} final-assets/ \;
          find release-assets/ -type f -name "*.vsix" -exec cp {} final-assets/ \;
          ls -lah final-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: final-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
