name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap compiler
        shell: bash
        # The latest published release still ships the legacy `pengu` CLI,
        # which cannot compile this tree in reasonable time. The checked-in
        # stage0 bundle gives a native `psc` with only a C compiler.
        run: bash ./tools/build_bootstrap.sh

      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          stage0=./build/psc-stage0
          if [ -f "$stage0.exe" ]; then stage0="$stage0.exe"; fi
          "$stage0" build .
          psc_bin=./build/psc
          if [ -f "$psc_bin.exe" ]; then psc_bin="$psc_bin.exe"; fi
          "$psc_bin" version

      - name: Package portable/FHS
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}" \
          PENGU_BIND="${PENGU_BIND:-build/pengu-bind}" \
          tools/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pengu-release
          path: dist/*
