name: bench

# Benchmarks are noisy on shared runners, so they never block a pull request:
# they run on a schedule and on demand, and the CSV is uploaded as an artifact.
on:
  schedule:
    - cron: '0 3 * * *'   # nightly, after the fuzz job
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Runs per measurement (best kept)'
        required: false
        default: '5'

jobs:
  bench:
    name: benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Build the runtime
        run: python build_runtime.py

      - name: Run benchmarks
        run: |
          REPEAT="${{ github.event.inputs.repeat }}"
          [ -n "$REPEAT" ] || REPEAT=5
          python benches/run_bench.py --repeat "$REPEAT" \
            --csv "benches/results/${{ matrix.os }}-$(date -u +%Y%m%d).csv" \
            | tee bench-report.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: |
            benches/results/
            bench-report.txt
          if-no-files-found: warn
