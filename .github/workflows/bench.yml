name: bench

# CI audit fixes:
#  * every `run:` that uses POSIX constructs declares `shell: bash`, so adding a
#    Windows runner cannot silently break on pwsh ([[ ]], date, tee).
#  * the runtime build is cached and the Linux/macOS native dependencies come from
#    the shared composite action (previously missing here, which made the
#    benchmark less representative than ci.yml).
#  * no more `|| true` swallowing install failures.
#  * `if-no-files-found: error`: an empty result set is a harness failure.
#  * benchmarks never block a pull request (they are noisy on shared runners).

on:
  schedule:
    - cron: '0 3 * * *'   # nightly, after the fuzz job
  workflow_dispatch:
    inputs:
      repeat:
        description: 'Runs per measurement (best kept)'
        required: false
        default: '5'
        type: string

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  # A half-finished benchmark series is worse than a superseded one.
  cancel-in-progress: false

jobs:
  bench:
    name: benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Windows is intentionally excluded: there the numbers are dominated by
      # Defender/AV scanning and are not representative of the toolchain.
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          REPEAT="${{ github.event.inputs.repeat || '5' }}"
          STAMP="$(date -u +%Y%m%d)"
          mkdir -p benches/results
          python benches/run_bench.py \
            --repeat "$REPEAT" \
            --csv "benches/results/${{ matrix.os }}-${STAMP}.csv" \
            | tee bench-report.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}-${{ github.run_id }}
          path: |
            benches/results/
            bench-report.txt
          # An empty artifact means the harness produced nothing: fail loudly.
          if-no-files-found: error
          retention-days: 90
