name: CI (Windows / Linux / macOS)

# CI audit fixes:
#  * permissions are read-only by default; only the tag job may write.
#  * concurrency cancels superseded PR runs but never a push to main.
#  * every job has a timeout (the GitHub default is 6 h).
#  * the shared setup (deps + runtime cache) lives in .github/actions/setup-pengu.
#  * the ABI layout check is portable (no hardcoded `cc`, which does not exist on
#    Windows runners).
#  * the VSIX is built once instead of three times.
#  * auto-tag only creates the tag: release.yml owns the GitHub Release, so two
#    workflows cannot race to publish the same tag.  Because a GITHUB_TOKEN push
#    cannot trigger another workflow, auto-tag then *dispatches* release.yml
#    explicitly (Phase 9, item 9.6).

'on':
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact_name: pengu-windows-x64
          - os: ubuntu-latest
            label: Linux x64
            artifact_name: pengu-linux-x64
          - os: macos-latest
            label: macOS (arm64)
            artifact_name: pengu-macos

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Toolchain smoke test (run + cache + doctor)
        timeout-minutes: 10
        run: |
          python scripts/smoke.py

      - name: Standard library formatting gate
        run: |
          python pengu_project.py fmt --check std/

      # Undefined names are compiler crashes, not style. F821 as an ERROR would
      # have caught blocker B6 (`node` instead of `target_node` in
      # pengu_infer.py) automatically. E9 covers syntax-level breakage.
      - name: Lint gate (F821 undefined names are errors)
        run: |
          python -m ruff check --select F821,E9 --exclude extern,build,vscode-extension .

      # FASE 1 (compiler correctness). The new suites are the regression tests for
      # blockers B1/B2/B3/B6/B7 plus the front-end crash sweep; each one was
      # verified to fail when its fix is reverted.
      - name: Strict grammar & parser validation (FASE 1)
        run: |
          python -m pytest tests/test_grammar_strict.py tests/test_fase1_e2e.py \
            tests/test_cli_contract.py tests/test_module_qualified_types.py \
            tests/test_return_analysis.py tests/test_audit_regressions.py \
            -q -p no:cacheprovider --timeout=600 -x

      - name: C99 portability & ABI gate (FASE 2)
        run: |
          python -m pytest tests/test_c99_portability.py tests/test_attributes_msvc_text.py \
            tests/test_attributes_msvc_native.py tests/test_abi_layout.py \
            tests/test_bounds_flag_independence.py -q -p no:cacheprovider --timeout=600 -x

      - name: Tooling gate (FASE 3)
        run: |
          python -m pytest tests/test_bind_phase3.py tests/test_assets.py tests/test_json_diagnostics.py tests/test_lsp_semantic_rename.py tests/test_lsp_semantic_tokens.py tests/test_lsp_navigation_extra.py tests/test_fmt_phase3.py tests/test_doc_phase3.py tests/test_cross_compile.py -q -p no:cacheprovider --timeout=600 -x

      - name: Ecosystem gate (FASE 4)
        run: |
          python -m pytest tests/test_semver.py tests/test_lockfile.py tests/test_transitive_deps.py tests/test_deps_commands.py tests/test_vendor_cache.py tests/test_manifest_toml.py tests/test_init_templates.py tests/test_std_versioning.py tests/test_std_docs_completeness.py -q -p no:cacheprovider --timeout=600 -x

      - name: Safety & supply-chain gate (FASE 5)
        run: |
          python -m pytest tests/test_phase5_bugfixes.py tests/test_bounds_policy.py tests/test_overflow_policy.py tests/test_deprecation_policy.py tests/test_supply_chain.py tests/test_runtime_hardening.py tests/test_fuzz_harnesses.py -q -p no:cacheprovider --timeout=600 -x

      # Portable ABI layout check: Windows runners have no `cc`, so decide the
      # compiler from the environment (MinGW gcc on Windows, cc elsewhere).
      - name: ABI layout matrix (Phase 5 / 5.7.f)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            CC_BIN="gcc"
            OUT="build/abi_layout_check.exe"
          else
            CC_BIN="${CC:-cc}"
            OUT="build/abi_layout_check"
          fi
          "$CC_BIN" -std=c11 -Wall -Wextra -I. -Ibuild/include \
            -o "$OUT" tests/abi/test_abi_layout.c
          "./$OUT"

      - name: DX gate (FASE 6)
        run: |
          python -m pytest tests/test_phase6_bugfixes.py tests/test_benchmarks.py tests/test_phase6_scope.py tests/test_init_templates.py -q -p no:cacheprovider --timeout=900 -x

      # CI/CD invariants (no double release, timeouts, permissions, portable
      # steps, release checksums).  Runs here so a broken workflow is caught by
      # the same pipeline it configures.
      - name: CI/CD gate (FASE 7)
        run: |
          python -m pytest tests/test_ci_workflows.py -q -p no:cacheprovider --timeout=120 -x

      # Superset of the old "fast fail on core reviews" step: that one ran the
      # same files as the full suite below, so it only ever duplicated work.
      # Phase 8 / item 8.6: the full suite runs *under coverage* so the ratchet in
      # .coveragerc is enforced by the same run. A reported number that is below
      # `fail_under` fails the step, which is what makes it non-decreasing.
      #
      # The ratchet is enforced on Linux only, and the full suite still runs on
      # all three platforms.  `fail_under` is a single number, but test
      # *collection* is not platform independent: the leak-check interposer is
      # glibc/ELF-only, Windows has no POSIX signals, and macOS uses system
      # libs.  Those skips remove whole `compile_run` programs -- i.e. exactly
      # the codegen paths coverage counts -- so the same commit measures
      # different totals per OS and a floor calibrated on Linux turns into a
      # coin flip elsewhere.  Linux is the platform AUDIT_1.0_FASE8.md measured,
      # so it is the platform that owns the number; Windows and macOS run the
      # identical suite without the measurement.
      - name: Phase 8 gates (F821/E9, corpora, properties, scale)
        shell: bash
        run: |
          set -euo pipefail
          COV=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            COV="--cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml:coverage.xml"
          fi
          # shellcheck disable=SC2086  # word splitting is how the flags are passed
          python -m pytest tests -q -p no:cacheprovider --timeout=1200 $COV

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.artifact_name }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Package standalone release
        run: |
          python make_release.py

      # Deterministic archive (Phase 9, item 9.8): sorted entries, constant
      # mtime from SOURCE_DATE_EPOCH, so the same tree always hashes the same.
      - name: Archive distribution (Windows)
        if: runner.os == 'Windows'
        run: |
          python make_release.py --archive-only --dist-dir pengucc_build --archive "${{ matrix.artifact_name }}.zip"

      - name: Archive distribution (Unix)
        if: runner.os != 'Windows'
        run: |
          python make_release.py --archive-only --dist-dir pengucc_build --archive "${{ matrix.artifact_name }}.tar.gz"

      # The same commit must produce the same bytes (item 9.8). Packing the same
      # tree twice proves the archive layer; the binary's own determinism is
      # measured in AUDIT_1.0_FASE9.md item 9.8.
      - name: Reproducibility check (archive twice, compare)
        shell: bash
        run: |
          set -euo pipefail
          EXT="zip"; [ "$RUNNER_OS" != "Windows" ] && EXT="tar.gz"
          python make_release.py --archive-only --dist-dir pengucc_build --archive "repro-check.$EXT"
          python make_release.py --archive-only --dist-dir pengucc_build --archive "repro-check-2.$EXT"
          A=$(sha256sum "repro-check.$EXT" | cut -d' ' -f1)
          B=$(sha256sum "repro-check-2.$EXT" | cut -d' ' -f1)
          echo "run 1: $A"; echo "run 2: $B"
          test "$A" = "$B" || { echo "::error::archive is not reproducible: $A != $B"; exit 1; }
          rm -f "repro-check.$EXT" "repro-check-2.$EXT"

      - name: Upload standalone artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      # Phase 9, item 9.12: the *packaged artifact* must work, not just the tree
      # it was built from. Run it in the portable layout and installed into a real
      # FHS prefix (pengu_paths.fhs_prefixes discovers the prefix from
      # <prefix>/bin/pengu; the FHS run also proves the prefix is what made the
      # build link, by hiding <prefix>/lib/pengu and requiring the failure).
      - name: Verify the artifact in the portable layout
        shell: bash
        run: |
          set -euo pipefail
          EXT="zip"; [ "$RUNNER_OS" != "Windows" ] && EXT="tar.gz"
          python scripts/verify_release_artifact.py \
            --artifact "${{ matrix.artifact_name }}.$EXT" --layout portable

      - name: Verify the artifact installed in an FHS prefix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_artifact.py \
            --artifact "${{ matrix.artifact_name }}.tar.gz" --layout fhs

  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The VSIX is platform independent: building it once avoids three identical
      # artifacts and a per-OS npm install.
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci
          npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          if-no-files-found: warn
          retention-days: 30

  auto-tag:
    name: Auto Tag
    needs: [ build, vscode-extension ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      # Needed to dispatch release.yml: `contents: write` cannot start a run.
      actions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'

      # The previous regex took the FIRST "## [...]" heading, which after the
      # phase headers is "## [Unreleased] — ..." and would have pushed a
      # "vUnreleased" tag.  scripts/release_version.py skips [Unreleased] and is
      # shared with release.yml so both agree on the version.
      - name: Resolve version from CHANGELOG
        id: changelog
        run: |
          python scripts/release_version.py --github-output "$GITHUB_OUTPUT"

      - name: Create Git Tag if Not Exists
        id: tag
        run: |
          TAG="${{ steps.changelog.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating and pushing tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "${{ steps.changelog.outputs.title }}"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi
      # NOTE: this job deliberately does NOT create a GitHub Release.
      # release.yml owns the release (build + checksums + publish).  Creating it
      # here too raced release.yml for the same tag and produced
      # duplicated/partial releases.
      #
      # The handoff is an explicit dispatch, not the tag push.  GitHub documents
      # that a push performed with the repository's GITHUB_TOKEN does **not**
      # create a new workflow run (`workflow_dispatch` is the documented
      # exception), so `release.yml`'s `push: tags` never fired for a tag created
      # here: the "pushing the tag triggers the release" claim was a comment, not
      # a mechanism (audit §18.1 #10, roadmap item 9.6).
      - name: Dispatch the release workflow for the new tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.changelog.outputs.tag_name }}"
          echo "dispatching release.yml for $TAG"
          gh workflow run release.yml --ref "${GITHUB_REF_NAME}" -f version="$TAG"

