name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: PSC (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap PSC
        uses: ./.github/actions/setup-psc-bootstrap
        with:
          version: "0.10.0"

      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          psc version
          psc build .
          ./build/psc version

      - name: Format gate
        shell: bash
        run: psc fmt --check src std

      - name: PSC tests
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/run.sh

      - name: PSC tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run.ps1

      - name: Bind smoke
        shell: bash
        run: |
          psc bind c_bind_stubs/stdio.h --output=/tmp/psc-bind-check.d.pengu
          test -s /tmp/psc-bind-check.d.pengu

      - name: ASan/UBSan smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./build/psc emit-c src/main.pengu --out=/tmp/psc-asan.c
          cc -std=c11 -g -O1 -fsanitize=address,undefined -I "$PENGU_INCLUDE_DIR" -I . -I std_c \
            /tmp/psc-asan.c "$PENGU_LIB_DIR/libpengu_runtime.a" -lm -lpthread -ldl -o /tmp/psc-asan
          ASAN_OPTIONS=detect_leaks=0 /tmp/psc-asan version
