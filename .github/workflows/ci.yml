name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: PSC (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap compiler
        id: bootstrap
        uses: ./.github/actions/setup-psc-bootstrap

      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          case "$PENGU_COMPILER_NAME" in
            psc|psc.exe)
              "$PENGU_COMPILER" build .
              ;;
            *)
              # Legacy releases ship `pengu`, which resolves the project from
              # the working directory instead of taking a path argument.
              "$PENGU_COMPILER" build
              ;;
          esac
          ./build/psc version

      - name: Format gate
        shell: bash
        run: ./build/psc fmt --check src std

      - name: PSC tests
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/run.sh

      - name: PSC tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run.ps1

      - name: Bind smoke
        shell: bash
        run: |
          if [ -z "${PENGU_BIND:-}" ]; then
            echo "::notice::bootstrap does not ship pengu-bind; skipping bind smoke"
            exit 0
          fi
          ./build/psc bind c_bind_stubs/stdio.h --output=/tmp/psc-bind-check.d.pengu
          test -s /tmp/psc-bind-check.d.pengu

      - name: ASan/UBSan smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./build/psc emit-c src/main.pengu --out=/tmp/psc-asan.c
          cc -std=c11 -g -O1 -fsanitize=address,undefined -I "$PENGU_INCLUDE_DIR" -I . -I std_c \
            /tmp/psc-asan.c "$PENGU_LIB_DIR/libpengu_runtime.a" -lm -lpthread -ldl -o /tmp/psc-asan
          ASAN_OPTIONS=detect_leaks=0 /tmp/psc-asan version
