name: CI (Windows / Linux / macOS)

'on':
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact_name: pengu-windows-x64
            artifact_cmd: powershell
          - os: ubuntu-latest
            label: Linux x64
            artifact_name: pengu-linux-x64
            artifact_cmd: tar
          - os: macos-latest
            label: macOS (arm64)
            artifact_name: pengu-macos
            artifact_cmd: tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'vscode-extension/package-lock.json'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gcc \
            zlib1g-dev libpcre2-dev libxml2-dev libcurl4-openssl-dev \
            libmbedtls-dev libmicrohttpd-dev libsqlite3-dev libssl-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl1-mesa-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config curl pcre2 libmicrohttpd mbedtls libxml2 || true
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix pcre2)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libmicrohttpd)/lib/pkgconfig:$(brew --prefix mbedtls)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build C runtime & dependencies
        run: |
          python build_runtime.py

      - name: Run test suite
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Package standalone release + VS Code extension
        run: |
          python make_release.py

      - name: Archive distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "pengucc_build/*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Archive distribution (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.artifact_name }}.tar.gz" -C pengucc_build .

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

      - name: Upload VS Code extension VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.os }}
          path: vscode-extension/*.vsix
          if-no-files-found: error

  auto-tag-and-release:
    name: Auto Tag and Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Extract Release Notes from CHANGELOG.md
        id: changelog
        run: |
          python - << 'EOF'
          import os
          import re
          from pathlib import Path

          content = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^##\s*\[([^\]]+)\](?:\s*-\s*(.*))?", content, re.MULTILINE)
          if not match:
              raise SystemExit("Error: Could not find version heading in CHANGELOG.md (expected '## [version]')")

          version = match.group(1).strip()
          suffix = (match.group(2) or "").strip()
          tag = f"v{version}"
          title = f"PenguScript v{version}" + (f" - {suffix}" if suffix and suffix != "Unreleased" else "")

          start = match.end()
          next_match = re.search(r"^##\s*\[", content[start:], re.MULTILINE)
          body = content[start:start + next_match.start()].strip() if next_match else content[start:].strip()

          Path("release_notes.md").write_text(body + "\n", encoding="utf-8")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as gh_out:
              gh_out.write(f"version={version}\n")
              gh_out.write(f"tag_name={tag}\n")
              gh_out.write(f"title={title}\n")
          EOF

      - name: Create Git Tag if Not Exists
        run: |
          TAG="${{ steps.changelog.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            echo "Creating and pushing tag $TAG..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "${{ steps.changelog.outputs.title }}"
            git push origin "$TAG"
          fi

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Organize Release Assets
        run: |
          mkdir -p final-assets
          find release-assets/ -type f -name "*.zip" -exec cp {} final-assets/ \;
          find release-assets/ -type f -name "*.tar.gz" -exec cp {} final-assets/ \;
          find release-assets/ -type f -name "*.vsix" -exec cp {} final-assets/ \;
          ls -lah final-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.changelog.outputs.tag_name }}
          name: ${{ steps.changelog.outputs.title }}
          body_path: release_notes.md
          files: final-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
