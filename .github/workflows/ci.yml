name: CI

# One workflow for push/PR.  Responsibilities:
#   * fast feedback (smoke, no runtime build)
#   * compile + test on Linux / Windows / macOS
#   * a compiler matrix (gcc + clang) for the compliance and migration corpora
#   * package the release, archive it reproducibly and verify the artifact
#   * auto-tag when a commit to main carries a new CHANGELOG.md section
#
# The heavy, non-blocking work (fuzz, sanitizers, CodeQL, the Linux -> Windows
# cross-compile and the benchmarks) lives in `.github/workflows/nightly.yml` and
# is deliberately not duplicated here.  `release.yml` owns publishing a Release;
# this workflow only creates a tag.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.14'
  NODE_VERSION: '20'

jobs:
  # ----------------------------------------------------------------------
  # Fast feedback: unit tests only, no C compiler and no runtime build.
  # The `_smoke/` corpus cases are collected on purpose and skip here, because
  # `build-runtime: false` means the runtime archive is absent and the runner
  # skips instead of failing for an environmental reason.  Measured: ~3 s.
  # ----------------------------------------------------------------------
  smoke:
    name: Smoke (fast feedback)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment (no runtime build)
        uses: ./.github/actions/setup-pengu
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          build-runtime: 'false'

      - name: Smoke tests
        run: |
          python pengu_project.py selftest --smoke

  # ----------------------------------------------------------------------
  # The real matrix: Linux / Windows / macOS.
  #   * setup-pengu builds the runtime (cached).
  #   * fmt and ruff gate the standard library and undefined names.
  #   * the C `_Static_assert` ABI check is compiled with the runner's compiler.
  #   * the full suite runs with `-n auto`; coverage is enforced on Linux only.
  #   * the release is packaged, archived deterministically and verified in the
  #     portable and FHS layouts before the artifact is uploaded.
  # ----------------------------------------------------------------------
  test:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact_name: pengu-windows-x64
            archive_ext: zip
          - os: ubuntu-latest
            label: Linux x64
            artifact_name: pengu-linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            label: macOS (arm64)
            artifact_name: pengu-macos
            archive_ext: tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Toolchain smoke test (run + cache + doctor)
        timeout-minutes: 10
        run: |
          python scripts/smoke.py

      - name: Standard library formatting gate
        run: |
          python pengu_project.py fmt --check std/

      # Undefined names are compiler crashes, not style. F821 as an ERROR would
      # have caught blocker B6 (`node` instead of `target_node` in
      # pengu_infer.py) automatically. E9 covers syntax-level breakage.
      - name: Lint gate (F821/E9, undefined names are errors)
        run: |
          python -m ruff check --select F821,E9 \
            --exclude extern,build,vscode-extension .

      # Portable ABI layout check: Windows runners have no `cc`, so decide the
      # compiler from the environment (MinGW gcc on Windows, cc elsewhere).
      - name: ABI layout matrix (Phase 5 / 5.7.f)
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            CC_BIN="gcc"
            OUT="build/abi_layout_check.exe"
          else
            CC_BIN="${CC:-cc}"
            OUT="build/abi_layout_check"
          fi
          "$CC_BIN" -std=c11 -Wall -Wextra -I. -Ibuild/include \
            -o "$OUT" tests/abi/test_abi_layout.c
          "./$OUT"

      # Compiled conformance bundles. One rolling key per OS is enough because
      # the cache's own keys are content digests *inside* the directory: a
      # restored but stale entry is simply not used and the corpus is
      # recompiled. Measured: the 85-case corpus takes 85 s from cold and 2 s
      # when every group is already built.
      - name: Restore compiled conformance bundles
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_conformance_cache
          key: conformance-bundles-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            conformance-bundles-${{ runner.os }}-

      # The full suite. Coverage is applied on Linux only: test *collection* is
      # not platform independent (the leak-check interposer is glibc/ELF-only,
      # Windows has no POSIX signals, macOS uses system libs) and `fail_under`
      # is a single number. Linux is the platform AUDIT_1.0_FASE8.md measured,
      # so Linux owns the ratchet; Windows and macOS run the identical suite
      # without the measurement.
      - name: Test suite
        shell: bash
        timeout-minutes: 45
        run: |
          set -euo pipefail
          COV=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            COV="--cov --cov-config=.coveragerc --cov-report=term-missing --cov-report=xml:coverage.xml"
          fi
          # shellcheck disable=SC2086  # word splitting is how the flags are passed
          python -m pytest tests -q -n auto -p no:cacheprovider \
            --timeout=1200 $COV

      - name: Upload coverage report (Linux)
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Package standalone release
        run: |
          python make_release.py

      # Deterministic archive (Phase 9, item 9.8): sorted entries with a
      # constant mtime from SOURCE_DATE_EPOCH, so the same tree always hashes
      # the same bytes.
      - name: Archive distribution
        shell: bash
        run: |
          set -euo pipefail
          python make_release.py --archive-only \
            --dist-dir pengucc_build \
            --archive "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}"

      # The same commit must produce the same bytes (item 9.8). Packing the same
      # tree twice proves the archive layer.
      - name: Reproducibility check (same commit, same bytes)
        shell: bash
        run: |
          set -euo pipefail
          python make_release.py --archive-only \
            --dist-dir pengucc_build \
            --archive "repro-check-${{ matrix.artifact_name }}.${{ matrix.archive_ext }}"
          A=$(sha256sum "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" | cut -d' ' -f1)
          B=$(sha256sum "repro-check-${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" | cut -d' ' -f1)
          echo "run 1: $A"; echo "run 2: $B"
          test "$A" = "$B" || { echo "::error::archive is not reproducible: $A != $B"; exit 1; }
          rm -f "repro-check-${{ matrix.artifact_name }}.${{ matrix.archive_ext }}"

      - name: Upload standalone artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 30

      # Phase 9, item 9.12: the *packaged artifact* must work, not just the tree
      # it was built from. It is run in the portable layout and installed into a
      # real FHS prefix; the FHS run also proves the prefix is what made the
      # build link, by hiding <prefix>/lib/pengu and requiring the documented
      # failure.
      - name: Verify the artifact in the portable layout
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_artifact.py \
            --artifact "${{ matrix.artifact_name }}.${{ matrix.archive_ext }}" \
            --layout portable

      - name: Verify the artifact installed in an FHS prefix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_artifact.py \
            --artifact "${{ matrix.artifact_name }}.tar.gz" \
            --layout fhs

  # ----------------------------------------------------------------------
  # Compiler matrix (roadmap 10.3): the compliance corpus is the workload that
  # proves the generated C links under both gcc and clang, and the migration
  # corpus answers the MIGRATION.md question.  The full suite above compiles
  # with the runner's *default* compiler, so this job is what keeps the matrix
  # a matrix in CI rather than prose.  Measured: ~9 s for the 56-case corpus
  # once the runtime is cached.
  # ----------------------------------------------------------------------
  compliance:
    name: Compliance (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu

      - name: Run the compliance corpus under ${{ matrix.cc }}
        env:
          PENGU_TEST_CC: ${{ matrix.cc }}
        run: |
          python -m pytest tests/test_conformance.py -m conformance \
            -q -p no:cacheprovider --timeout=1800

      # Compiler-independent, so one leg runs it: the documentation-coverage
      # gate (every migrated case pins a numbered LANGUAGE.md section) and the
      # migration corpus.
      - name: Corpus documentation gate and migration corpus
        if: matrix.cc == 'gcc'
        run: |
          python -m pytest tests/test_compliance_corpus.py tests/test_migration_corpus.py \
            -q -p no:cacheprovider --timeout=1800

  # ----------------------------------------------------------------------
  # VSIX: platform-independent, so it is built ONCE (not 3x).
  # ----------------------------------------------------------------------
  vscode-extension:
    name: VS Code Extension
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build VSIX
        working-directory: vscode-extension
        run: |
          npm ci
          npx --yes @vscode/vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-extension
          path: vscode-extension/*.vsix
          if-no-files-found: warn
          retention-days: 30

  # ----------------------------------------------------------------------
  # Auto-tag: reads CHANGELOG.md, creates the tag if it does not exist and
  # DISPATCHES `release.yml` (a push made with GITHUB_TOKEN does not start a
  # workflow; `workflow_dispatch` is the documented exception).  It only creates
  # the tag and never publishes anything: `release.yml` is the sole publisher.
  # ----------------------------------------------------------------------
  auto-tag:
    name: Auto Tag
    needs: [ smoke, test, compliance, vscode-extension ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Needed to start `release.yml`: `contents: write` cannot do it.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      # The previous regex took the FIRST "## [...]" heading, which after the
      # phase headers is "## [Unreleased] — ..." and would have pushed a
      # "vUnreleased" tag.  scripts/release_version.py skips [Unreleased] and is
      # shared with release.yml so both agree on the version.
      - name: Resolve version from CHANGELOG
        id: changelog
        run: |
          python scripts/release_version.py --github-output "$GITHUB_OUTPUT"

      - name: Create Git Tag if Not Exists
        id: tag
        run: |
          TAG="${{ steps.changelog.outputs.tag_name }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "${{ steps.changelog.outputs.title }}"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch the publishing workflow for the new tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "dispatching for ${{ steps.changelog.outputs.tag_name }}"
          gh workflow run release.yml \
            --ref "${GITHUB_REF_NAME}" \
            -f version="${{ steps.changelog.outputs.tag_name }}"
