name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Compilador y herramientas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Caché de compilación
        uses: Swatinem/rust-cache@v2
      - name: Formato de Rust
        run: cargo fmt --all -- --check
      - name: Clippy sin avisos
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests del workspace
        run: cargo test --workspace
      - name: Compilar el binario `pengu`
        run: cargo build -p pengu-cli
      - name: La stdlib está formateada
        run: ./target/debug/pengu fmt --check std
      - name: La stdlib no tiene avisos
        run: ./target/debug/pengu lint --std std
      - name: Los ejemplos están formateados
        run: ./target/debug/pengu fmt --check examples
      - name: Los ejemplos no tienen avisos
        run: ./target/debug/pengu lint examples
      - name: Sintaxis de los scripts de instalación
        run: |
          sh -n scripts/install.sh
          sh -n scripts/package.sh
          node --check scripts/vsix.mjs
      - name: La extensión de VS Code pasa la validación
        run: node scripts/vsix.mjs --check
      - name: La extensión se activa y arranca el servidor
        run: node editors/check-extension.mjs target/debug/pengu
      - name: Prueba de humo del LSP
        run: node editors/smoke.mjs target/debug/pengu
      - name: El instalador funciona desde el código fuente
        run: ./scripts/install.sh --from-source . --prefix "$RUNNER_TEMP/pengu" --no-path
      - name: El paquete contiene el binario y las sumas
        run: ./scripts/package.sh --skip-build --version 0.1.0 --out "$RUNNER_TEMP/dist"
