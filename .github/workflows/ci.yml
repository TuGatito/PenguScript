name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: PSC (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
    steps:
      - uses: actions/checkout@v4

      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      - name: Build bootstrap compiler
        shell: bash
        # The latest published release still ships the legacy `pengu` CLI,
        # which cannot compile this tree in reasonable time. The checked-in
        # stage0 bundle gives a native `psc` with only a C compiler.
        run: bash ./tools/build_bootstrap.sh

      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          ./build/psc-stage0 build .
          ./build/psc version

      - name: Format gate
        shell: bash
        run: ./build/psc fmt --check src std

      - name: Stage0 freshness
        shell: bash
        run: bash ./tools/gen_stage0.sh --check

      - name: PSC tests
        shell: bash
        run: ./tests/run.sh

      - name: Bind smoke
        shell: bash
        run: |
          if [ -z "${PENGU_BIND:-}" ]; then
            echo "::notice::bootstrap does not ship pengu-bind; skipping bind smoke"
            exit 0
          fi
          ./build/psc bind c_bind_stubs/stdio.h --output=/tmp/psc-bind-check.d.pengu
          test -s /tmp/psc-bind-check.d.pengu

      - name: ASan/UBSan smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./build/psc emit-c src/main.pengu --out=/tmp/psc-asan.c
          cc -std=c11 -g -O1 -fsanitize=address,undefined -I "$PWD/build/include" -I . -I std_c \
            /tmp/psc-asan.c build/lib/libpengu_runtime.a -lm -lpthread -ldl -o /tmp/psc-asan
          ASAN_OPTIONS=detect_leaks=0 /tmp/psc-asan version

      - name: Package portable
        shell: bash
        run: bash ./tools/package_ci.sh

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release from CHANGELOG
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download release files
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Create tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md |
            sed -E 's/^## \[([^]]+)\].*/\1/')"
          if [ -z "$VERSION" ]; then
            echo "::error::CHANGELOG.md has no versioned section"
            exit 1
          fi
          TAG="v$VERSION"
          echo "CHANGELOG version: $VERSION (tag $TAG)"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::tag $TAG already exists; skipping release"
            exit 0
          fi
          shopt -s nullglob
          archives=(dist/*.tar.gz dist/*.zip)
          shopt -u nullglob
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::no release archives were produced"
            exit 1
          fi
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          TITLE="$(awk -v ver="$VERSION" \
            'index($0, "## [" ver "]") == 1 { print; exit }' CHANGELOG.md |
            sed -E 's/^## \[[^]]+\] — [0-9]{4}-[0-9]{2}-[0-9]{2} — //')"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS.txt)
          assets=()
          for f in dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt; do
            [ -f "$f" ] && assets+=("$f")
          done
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "PenguScript v$VERSION — $TITLE" \
            --notes-file release-notes.md "${assets[@]}"

