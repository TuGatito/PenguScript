name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: PSC (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, label: linux }
          - { os: macos-latest, label: macos }
          - { os: windows-latest, label: windows }
    steps:
      - uses: actions/checkout@v4

      - name: Build bootstrap compiler
        shell: bash
        # The latest published release still ships the legacy `pengu` CLI,
        # which cannot compile this tree in reasonable time. The checked-in
        # stage0 bundle gives a native `psc` with only a C compiler.
        run: bash ./tools/build_bootstrap.sh

      - name: Build compiler
        shell: bash
        run: |
          set -euo pipefail
          stage0=./build/psc-stage0
          if [ -f "$stage0.exe" ]; then stage0="$stage0.exe"; fi
          "$stage0" build .
          psc_bin=./build/psc
          if [ -f "$psc_bin.exe" ]; then psc_bin="$psc_bin.exe"; fi
          "$psc_bin" version

      - name: Format gate
        shell: bash
        run: |
          set -euo pipefail
          psc_bin=./build/psc
          if [ -f "$psc_bin.exe" ]; then psc_bin="$psc_bin.exe"; fi
          "$psc_bin" fmt --check src std

      - name: Stage0 freshness
        shell: bash
        run: bash ./tools/gen_stage0.sh --check

      - name: PSC tests
        if: runner.os != 'Windows'
        shell: bash
        run: ./tests/run.sh

      - name: PSC tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run.ps1

      - name: Bind smoke
        shell: bash
        run: |
          if [ -z "${PENGU_BIND:-}" ]; then
            echo "::notice::bootstrap does not ship pengu-bind; skipping bind smoke"
            exit 0
          fi
          ./build/psc bind c_bind_stubs/stdio.h --output=/tmp/psc-bind-check.d.pengu
          test -s /tmp/psc-bind-check.d.pengu

      - name: ASan/UBSan smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./build/psc emit-c src/main.pengu --out=/tmp/psc-asan.c
          cc -std=c11 -g -O1 -fsanitize=address,undefined -I "$PWD/build/include" -I . -I std_c \
            /tmp/psc-asan.c build/lib/libpengu_runtime.a -lm -lpthread -ldl -o /tmp/psc-asan
          ASAN_OPTIONS=detect_leaks=0 /tmp/psc-asan version
