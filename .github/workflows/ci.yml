name: CI (Windows / Linux / macOS)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            artifact_name: pengu-windows-x64
            artifact_cmd: powershell
          - os: ubuntu-latest
            label: Linux x64
            artifact_name: pengu-linux-x64
            artifact_cmd: tar
          - os: macos-latest
            label: macOS (arm64)
            artifact_name: pengu-macos
            artifact_cmd: tar

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'vscode-extension/package-lock.json'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gcc \
            zlib1g-dev libpcre2-dev libxml2-dev libcurl4-openssl-dev \
            libmbedtls-dev libmicrohttpd-dev libsqlite3-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libgl1-mesa-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config pcre2 libmicrohttpd mbedtls libxml2 || true
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix pcre2)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix libmicrohttpd)/lib/pkgconfig:$(brew --prefix mbedtls)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build C runtime & dependencies
        run: |
          python build_runtime.py

      - name: Run test suite
        run: |
          python -m pytest tests -q -p no:cacheprovider

      - name: Package standalone release + VS Code extension
        run: |
          python make_release.py

      - name: Archive distribution (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "pengucc_build/*" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Archive distribution (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czf "${{ matrix.artifact_name }}.tar.gz" -C pengucc_build .

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

      - name: Upload VS Code extension VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.os }}
          path: vscode-extension/*.vsix
          if-no-files-found: error
