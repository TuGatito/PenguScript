name: CodeQL

# Roadmap 2.0 / Phase 8, item 8.14 — SAST over both halves of the project.
#
# The repository has two codebases worth analysing and they need different
# treatment:
#
#   * `python`  — the compiler, the LSP and the tooling. Nothing to build, so
#     CodeQL extracts straight from the sources.
#   * `c-cpp`   — the runtime (`pengu_runtime.h`, `pengu_parser/pengu_runtime.c`)
#     and the vendored `std_c/` shims. The *generated* bundles are test output and
#     are deliberately not analysed: `build-mode: none` keeps the scan on the
#     sources that a human wrote, which is what a SAST gate should cover.
#
# `security-extended` is the query suite that matters for a compiler that links
# third-party C: it adds the taint-tracking and memory-safety queries that the
# default suite omits. 0 high-severity alerts is the phase's criterion; the
# workflow does not fail on alerts by itself (CodeQL reports them to the Security
# tab), which is why the criterion is stated as an alert budget rather than a job
# status.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly, after the nightly fuzz budget: a new query release is the usual
    # source of a new alert on unchanged code.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Only the analysis jobs may upload results.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: "/language:${{ matrix.language }}"
