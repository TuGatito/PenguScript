name: fuzz

# CI audit fixes:
#  * `timeout-minutes` is larger than the requested budget, otherwise a 12 h
#    budget would be killed by GitHub's 6 h default with a confusing error.
#  * permissions are read-only and the job has a concurrency group.
#  * the crash corpus is uploaded with `if: always()`: a finding must not be lost
#    just because the harness exited 0.
#  * `|| true` no longer hides a broken requirements install; atheris, which is
#    Linux-only, is the single tolerated failure and it warns explicitly.

on:
  pull_request:
    branches: [ main, master ]
  schedule:
    # Nightly: one hour per harness.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Seconds per harness'
        required: false
        default: '21600'   # 6 h, the platform's per-job ceiling
        type: string

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (${{ matrix.harness }})
    runs-on: ubuntu-latest
    # GitHub kills a job after 6 h of execution, so a larger `timeout-minutes`
    # could never be reached: it was a number in a file, not a budget. The default
    # budget is clamped to fit (Phase 8 finding F8-N5); the long-budget form is
    # `.github/workflows/nightly.yml`, which splits it across shards.
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: parser
          - harness: bind
          - harness: semver
          - harness: lock
          - harness: lsp

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # atheris is Linux x86_64 only; smoke mode is the documented fallback.
          if ! pip install atheris; then
            echo "::warning::atheris unavailable; the deterministic smoke pass will run"
          fi

      - name: Cache runtime build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/lib
            build/include
          key: runtime-fuzz-${{ runner.os }}-${{ hashFiles('extern_manifest.py', 'build_runtime.py') }}
          restore-keys: runtime-fuzz-${{ runner.os }}-

      - name: Build runtime headers (needed by fuzz_bind)
        run: python build_runtime.py --headers-only || true

      - name: Determine budget
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          SECONDS=300
          case "${GITHUB_EVENT_NAME}" in
            schedule)          SECONDS=3600 ;;
            workflow_dispatch) SECONDS="${{ github.event.inputs.seconds }}" ;;
          esac
          # Never claim more than the platform will allow a single job to run.
          if [ "$SECONDS" -gt 21600 ]; then
            echo "::warning::clamping the fuzz budget to GitHub's 6 h job limit"
            SECONDS=21600
          fi
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Run ${{ matrix.harness }} harness
        shell: bash
        run: |
          set -euo pipefail
          BUDGET="${{ steps.budget.outputs.seconds }}"
          if python -c "import atheris" 2>/dev/null; then
            python "scripts/fuzz/fuzz_${{ matrix.harness }}.py" \
              -max_total_time="$BUDGET" -rss_limit_mb=4096 -print_final_stats=1
          else
            echo "::warning::atheris is not installed; running the deterministic smoke pass"
            PENGU_FUZZ_SMOKE=1 python "scripts/fuzz/fuzz_${{ matrix.harness }}.py"
          fi

      - name: Upload crash corpus
        # always(): findings are written to disk even when the harness exits 0.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-findings-${{ matrix.harness }}-${{ github.run_id }}
          path: build/fuzz_crashes/
          if-no-files-found: ignore
          retention-days: 90
