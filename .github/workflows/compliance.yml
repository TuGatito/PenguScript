name: Compliance & migration corpora

# Roadmap 2.0 / Phase 8, items 8.4, 8.5 and 8.13.
#
# Two corpora, two different questions:
#
#   compliance — `tests/compliance/` holds one canonical program per section of
#                `LANGUAGE.md`. It answers "does the language still do what the
#                normative document says it does?".
#   migration  — `tests/migration/` holds one program per published version line
#                from 0.10.0 on, with the outcome `MIGRATION.md` documents. It
#                answers "does code written for an older release still behave the
#                way the migration guide says?".
#
# They run as separate jobs so a failure names the corpus, and separately from
# `ci.yml` so a corpus that needs a rebuild does not re-run the whole matrix.
# Both need the C runtime (the compliance corpus compiles and executes).

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpora-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compliance:
    name: Compliance corpus (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Roadmap 10.3: the corpus is the compiler matrix's workload. The corpus
        # is compiler-independent now -- one bundle per collision-free group,
        # executed by the batch runner -- so the matrix only changes which compiler
        # links that bundle, through PENGU_TEST_CC.
        cc: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu

      # The 53 programs that tests/compliance/run_all.py used to drive one at a
      # time are conformance cases now (tests/conformance/compliance/): one build
      # per collision-free group plus one spawn per case, instead of 53
      # check+build+run cycles. Measured at ~9 s for the 56-case corpus.
      - name: Run the migrated corpus under the batch runner
        env:
          PENGU_TEST_CC: ${{ matrix.cc }}
        run: |
          python -m pytest tests/test_conformance.py -m conformance \
            -q -p no:cacheprovider --timeout=1800

      # Documentation-coverage gate: every migrated case still pins a real,
      # numbered LANGUAGE.md section. Compiler-independent, so one leg runs it.
      - name: Check the corpus still pins LANGUAGE.md
        if: matrix.cc == 'gcc'
        run: |
          python -m pytest tests/test_compliance_corpus.py -q -p no:cacheprovider --timeout=1800

  migration:
    name: Migration corpus (MIGRATION.md)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu

      - name: Run the migration corpus
        run: |
          python -m pytest tests/test_migration_corpus.py -q -p no:cacheprovider --timeout=1800
