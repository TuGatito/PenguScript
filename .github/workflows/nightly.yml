name: Nightly

# All the heavy, non-blocking work lives here.  It never runs on a branch push
# or on a pull request:
#   * fuzz          — the 6 harnesses, budget clamped to the platform ceiling
#   * sanitizers    — ASan + UBSan + valgrind (Linux)
#   * codeql        — SAST of Python and C/C++
#   * cross-compile — Linux -> Windows bundle and a real PE `.exe` under Wine
#   * bench         — benchmarks (shared runners are noisy)
#
# No job here blocks a pull request; `ci.yml` owns that.  GitHub kills a job
# after 6 h of execution, so every `timeout-minutes` below stays underneath that
# ceiling.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC — fuzz, sanitizers and CodeQL in parallel
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Seconds per fuzz harness'
        required: false
        default: '21600'
        type: string

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.14'

jobs:
  # ----------------------------------------------------------------------
  # Fuzz: 6 harnesses, each with its own budget.  atheris is Linux x86_64 only,
  # and the deterministic smoke pass is the documented fallback (it warns
  # explicitly instead of failing silently).
  # ----------------------------------------------------------------------
  fuzz:
    name: fuzz (${{ matrix.harness }})
    runs-on: ubuntu-latest
    # GitHub kills a job after 6 h; the budget is clamped to fit rather than
    # claimed.  (fuzz.yml used to declare 13 h — finding F8-N5.)
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        harness: [parser, enchanting, bind, semver, lock, lsp]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if ! pip install atheris; then
            echo "::warning::atheris unavailable; the deterministic smoke pass will run"
          fi

      - name: Cache runtime build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/lib
            build/include
          key: runtime-nightly-${{ runner.os }}-${{ hashFiles('extern_manifest.py', 'build_runtime.py') }}
          restore-keys: runtime-nightly-${{ runner.os }}-

      - name: Build runtime headers (needed by fuzz_bind)
        run: python build_runtime.py --headers-only || true

      - name: Determine budget
        id: budget
        shell: bash
        env:
          # Free-form dispatch input: through the environment, never `run:`.
          REQUESTED_SECONDS: ${{ github.event.inputs.fuzz_seconds }}
        run: |
          set -euo pipefail
          SECONDS=3600
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            SECONDS="$REQUESTED_SECONDS"
          fi
          # Never claim more than the platform will allow a single job to run.
          if [ "$SECONDS" -gt 21600 ]; then
            echo "::warning::clamping the fuzz budget to GitHub's 6 h job limit"
            SECONDS=21600
          fi
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Run ${{ matrix.harness }} harness
        shell: bash
        env:
          BUDGET: ${{ steps.budget.outputs.seconds }}
          HARNESS: ${{ matrix.harness }}
        run: |
          set -euo pipefail
          if python -c "import atheris" 2>/dev/null; then
            python "scripts/fuzz/fuzz_${HARNESS}.py" \
              -max_total_time="$BUDGET" -rss_limit_mb=4096 -print_final_stats=1
          else
            echo "::warning::atheris is not installed; running the deterministic smoke pass"
            PENGU_FUZZ_SMOKE=1 python "scripts/fuzz/fuzz_${HARNESS}.py"
          fi

      - name: Upload crash corpus
        # always(): findings are written to disk even when the harness exits 0.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-fuzz-${{ matrix.harness }}-${{ github.run_id }}
          path: build/fuzz_crashes/
          if-no-files-found: ignore
          retention-days: 90

  # ----------------------------------------------------------------------
  # Sanitizers: the project emits C, so the sanitizers are applied to the
  # *generated* code and to the runtime through PENGU_CFLAGS / PENGU_LDFLAGS
  # (`pengu_project.py` and `tests/compiler/conftest.py` both honour them, and
  # they are part of the runtime cache key, so an instrumented archive can never
  # be confused with a plain one).
  #
  # The workload is the compiler suite's `slow` half -- Pengu source -> generated
  # C -> instrumented binary -> execution.  That is where the sanitizers have the
  # most value now: every primitive method, every `shard T` monomorphization and
  # every existing container path goes through the code generator under ASan.
  # ----------------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan (generated C)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      PENGU_CFLAGS: '-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all'
      PENGU_LDFLAGS: '-fsanitize=address,undefined'
      UBSAN_OPTIONS: 'print_stacktrace=1:halt_on_error=1'
      # ASAN_OPTIONS is set per step on purpose: the leak verdict is the
      # difference between the two contracts, and a job-level value would hide
      # which step claims what.
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # runtime-cache-scope keeps sanitized runtime objects away from the plain
      # ones.
      - name: Set up build environment
        uses: ./.github/actions/setup-pengu
        with:
          runtime-cache-scope: asan

      # CONTRACT 1 - memory safety.  Every test that compiles a program inherits
      # PENGU_CFLAGS, so a use-after-free, a heap overflow or UB anywhere in the
      # generated code is fatal here.  The leak verdict is off: the compiler
      # suite's programs are deliberately short-lived, and "storage not released
      # before exit" is the runtime's documented surface, not this contract.
      - name: Memory safety on every compiled program (ASan + UBSan)
        env:
          ASAN_OPTIONS: 'detect_leaks=0:abort_on_error=1:halt_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1'
        run: |
          python -m pytest tests/compiler/ -m "slow" -q -p no:cacheprovider --timeout=1800

      # CONTRACT 2 - leak freedom on the programs that release what they own
      # (explicit `banish` / runtime-managed values).  Same workload, leak verdict
      # ON: an instrumented run that leaks is a finding.
      - name: Leak freedom on the same workload (detect_leaks=1)
        env:
          ASAN_OPTIONS: 'detect_leaks=1:abort_on_error=1:halt_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1'
        run: |
          python -m pytest tests/compiler/ -m "slow" -q -p no:cacheprovider --timeout=1800

      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-sanitizer-logs-${{ github.run_id }}
          path: |
            build/**/*.log
            **/asan*.txt
          if-no-files-found: ignore
          retention-days: 30

  # ----------------------------------------------------------------------
  # CodeQL: SAST over both halves of the project.
  #   * `python`  — the compiler, the LSP and the tooling (nothing to build).
  #   * `c-cpp`   — the hand-written runtime and shims.  The *generated* bundles
  #     are test output and are deliberately not analysed (`build-mode: none`).
  # `security-extended` adds the taint-tracking and memory-safety queries the
  # default suite omits.
  # ----------------------------------------------------------------------
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Only the analysis job may upload results.
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          category: "/language:${{ matrix.language }}"

  # ----------------------------------------------------------------------
  # Cross-compile Linux -> Windows: the *generated* C is compiled to a real
  # Windows object with MinGW, linked into a PE32+ `.exe` against a tiny
  # MinGW-built ABI shim, validated with `file` and executed under Wine.
  # What is NOT claimed: that a program using the runtime archive cross-compiles
  # — that needs the cross-built dependency stack (docs/CROSS_COMPILATION.md §9).
  # ----------------------------------------------------------------------
  cross-compile:
    name: Cross-compile (Linux -> Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu

      - name: Install MinGW-w64 and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine64 file

      # The generated C is the workload: a primitive-enchanting program whose
      # method bodies are monomorphized to plain C (`int32_t int_add_two(int32_t
      # self)`), so a cross-compile of the feature is a cross-compile of ordinary
      # scalar C -- no vtables, no boxing, nothing platform specific.
      - name: Generate the Windows bundle (primitive enchanting)
        run: |
          set -euo pipefail
          mkdir -p cross
          cat > cross/hello.pengu <<'EOF'
          enchanting int:
              weave add_two into int:
                  return self + 2

          weave main into int:
              var x as int is 4
              return calling x.add_two
          EOF
          python pengu_project.py build --entry cross/hello.pengu \
            --target x86_64-w64-mingw32 --output cross/hello.c
          test -f cross/hello.c
          grep -q "pengu_main" cross/hello.c
          grep -q "int_add_two" cross/hello.c

      - name: Cross-compile the generated bundle to a Windows object
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc -c cross/hello.c -o cross/hello.o \
            -I. -Ibuild -Ibuild/include \
            -Wno-error=implicit-function-declaration
          file cross/hello.o | tee cross/hello.o.info
          grep -q "PE32+" cross/hello.o.info

      - name: Link a real PE executable with a MinGW-built ABI shim
        run: |
          set -euo pipefail
          cat > cross/abi_shim.c <<'EOF'
          /* The only runtime symbol a header-only PenguScript program needs.
           * The rest of the runtime is header-only (`static inline`); the
           * archive exists for strings, containers and FFI, whose cross-build is
           * the documented gap. */
          #include "pengu_runtime.h"
          int pengu_abi_version(void) { return PENGU_ABI_VERSION; }
          EOF
          x86_64-w64-mingw32-gcc cross/abi_shim.c cross/hello.o -o cross/hello.exe \
            -I. -Ibuild -Ibuild/include
          file cross/hello.exe | tee cross/hello.exe.info
          grep -q "PE32+" cross/hello.exe.info

      - name: Execute the .exe under Wine
        run: |
          set -euo pipefail
          # The program returns 4 + 2, so the exit code is the observable: 6 means
          # the generated code (and the primitive method in it) ran on the target
          # platform.
          set +e
          wine64 cross/hello.exe
          rc=$?
          set -e
          echo "wine64 exit code: $rc"
          if [ "$rc" != "6" ]; then
            echo "::error::cross-compiled .exe returned $rc, expected 6"
            exit 1
          fi

      - name: Upload cross artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-cross-${{ github.run_id }}
          path: |
            cross/hello.c
            cross/hello.o
            cross/hello.exe
            cross/*.info
          if-no-files-found: ignore
          retention-days: 14

  # ----------------------------------------------------------------------
  # Benchmarks: nightly only, never a blocker.  Windows is intentionally
  # excluded — there the numbers are dominated by Defender/AV scanning.
  # ----------------------------------------------------------------------
  # ----------------------------------------------------------------------
  # F5 bootstrap: stage1 -> stage2 -> stage3 -> stage4 y punto fijo.
  # ----------------------------------------------------------------------
  psc-bootstrap:
    name: PSC bootstrap fixed point
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install TCC
        run: sudo apt-get update && sudo apt-get install -y tcc

      - name: Build stage1
        run: |
          cd psc
          python ../pengu_project.py build

      - name: Bootstrap stage1 -> stage2 -> stage3 -> stage4
        env:
          PSC_BOOTSTRAP: '1'
        run: python -m pytest -q tests/psc/test_f5_bootstrap.py

  bench:
    name: Benchmarks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu

      - name: Run benchmarks
        shell: bash
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%d)"
          mkdir -p benches/results
          python benches/run_bench.py \
            --repeat 5 \
            --csv "benches/results/${{ matrix.os }}-${STAMP}.csv" \
            | tee bench-report.txt

      - name: Upload results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-bench-${{ matrix.os }}-${{ github.run_id }}
          path: |
            benches/results/
            bench-report.txt
          # An empty artifact means the harness produced nothing: fail loudly.
          if-no-files-found: error
          retention-days: 90
