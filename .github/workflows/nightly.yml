name: Nightly fuzz

# Roadmap 2.0 / Phase 8, item 8.16 — a fuzz budget GitHub can actually run.
#
# The roadmap originally asked for 72 h per harness. That is not a policy choice:
# GitHub kills a job after **6 h** of execution, so a single 72 h job cannot
# exist, and `fuzz.yml`'s 12 h default with a 13 h `timeout-minutes` could never
# have completed either — it was a number in a file, not a budget.
#
# This workflow replaces "one long job" with **shards**: `HOURS_PER_HARNESS`
# (default 6) is divided across `SHARDS` (default 4) parallel jobs of equal
# length, each with a hard `timeout-minutes` below the platform ceiling. Every
# shard is an independent libFuzzer run with its own `-seed`, and its crash
# corpus is uploaded even when the harness exits 0.
#
# `tests/test_ci_workflows.py::test_no_ci_budget_exceeds_githubs_job_limit`
# enforces the ceiling over every workflow, so the mistake this file fixes cannot
# come back in another workflow.

on:
  schedule:
    # Nightly, after the sanitizers job (04:00) has finished.
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      hours_per_harness:
        description: 'Total fuzz hours per harness (split across the shards)'
        required: false
        default: '6'
        type: string
      shards:
        description: 'Parallel shards per harness'
        required: false
        default: '4'
        type: string

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (${{ matrix.harness }} shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Hard ceiling below GitHub's 6 h job limit: 6 h / 4 shards = 90 min per
    # shard, plus margin for the checkout, the runtime build and the upload.
    timeout-minutes: 150
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        harness: [parser, bind, semver, lock, lsp]
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # atheris is Linux x86_64 only; the deterministic smoke pass is the
          # documented fallback and warns explicitly instead of failing silently.
          if ! pip install atheris; then
            echo "::warning::atheris unavailable; the deterministic smoke pass will run"
          fi

      - name: Cache runtime build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            build/lib
            build/include
          key: runtime-nightly-${{ runner.os }}-${{ hashFiles('extern_manifest.py', 'build_runtime.py') }}
          restore-keys: runtime-nightly-${{ runner.os }}-

      - name: Build runtime headers (needed by fuzz_bind)
        run: python build_runtime.py --headers-only || true

      - name: Compute this shard's budget
        id: budget
        shell: bash
        run: |
          set -euo pipefail
          HOURS="${{ github.event.inputs.hours_per_harness || '6' }}"
          SHARDS="${{ github.event.inputs.shards || '4' }}"
          # total seconds per harness / shards, never above the 6 h platform cap.
          total=$(( HOURS * 3600 ))
          if [ "$total" -gt 21600 ]; then
            echo "::warning::clamping the budget to GitHub's 6 h per-harness limit"
            total=21600
          fi
          per=$(( total / SHARDS ))
          echo "seconds=$per" >> "$GITHUB_OUTPUT"
          echo "Shard ${{ matrix.shard }} of $SHARDS runs ${per}s"

      - name: Run ${{ matrix.harness }} harness (shard ${{ matrix.shard }})
        shell: bash
        run: |
          set -euo pipefail
          BUDGET="${{ steps.budget.outputs.seconds }}"
          SEED=$(( 1000 + ${{ matrix.shard }} * 7919 ))
          if python -c "import atheris" 2>/dev/null; then
            python "scripts/fuzz/fuzz_${{ matrix.harness }}.py" \
              -max_total_time="$BUDGET" -seed="$SEED" \
              -rss_limit_mb=4096 -print_final_stats=1
          else
            echo "::warning::atheris is not installed; running the deterministic smoke pass"
            PENGU_FUZZ_SMOKE=1 python "scripts/fuzz/fuzz_${{ matrix.harness }}.py"
          fi

      - name: Upload crash corpus
        # always(): findings are written to disk even when the harness exits 0.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-findings-${{ matrix.harness }}-${{ matrix.shard }}-${{ github.run_id }}
          path: build/fuzz_crashes/
          if-no-files-found: ignore
          retention-days: 90
