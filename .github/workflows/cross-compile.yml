name: Cross-compile (Linux -> Windows)

# Roadmap 2.0 / Phase 8, item 8.12.
#
# `docs/CROSS_COMPILATION.md` §9 records the measured boundary this workflow has
# to respect, and it is narrow:
#
#   * `--target x86_64-w64-mingw32` generates a Windows bundle and names the
#     artifact `.exe`; a real link needs a *cross-built* runtime.
#   * `pengu_parser/pengu_runtime.c` includes PCRE2, libxml2, zlib, mbedTLS,
#     libcurl and libmicrohttpd, so producing a Windows runtime means
#     cross-building that whole stack — there is no automated path for it yet
#     (`docs/CROSS_COMPILATION.md` §7.3).
#   * An unknown triple silently falls back to the host (§5), and `--target` does
#     not set the `when os` environment (§7.4).
#
# So this workflow proves exactly two things, and says so:
#
#   syntax  — the *generated* C is MinGW-compatible: it is compiled to a real
#             Windows object file with `x86_64-w64-mingw32-gcc -c`, which needs no
#             runtime archive.
#   pe      — a real PE `.exe` is produced and executed. The generated object is
#             linked against a tiny MinGW-compiled shim that supplies the single
#             runtime symbol a header-only program needs (`pengu_abi_version`);
#             the header-only part of the runtime is what is exercised. The
#             resulting `.exe` is validated as PE by `file` and run under Wine.
#
# What is NOT claimed: that a program using the runtime archive (strings,
# containers, FFI) cross-compiles — that needs the cross-built dependency stack.
# The roadmap's "real .exe" is met at the codegen/PE/execution level; the archive
# level is deferred to 1.1 and recorded in AUDIT_1.0_FASE8.md.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-compile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mingw:
    name: MinGW bundle and PE executable
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up build environment
        uses: ./.github/actions/setup-pengu

      - name: Install MinGW-w64 and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine64 file

      # The opt-in cross test has been skipped everywhere since it was written
      # because no runner had a MinGW compiler. Here it stops skipping.
      - name: Cross-compilation suite with a real MinGW toolchain
        run: |
          python -m pytest tests/test_cross_compile.py -q -p no:cacheprovider --timeout=600 \
            -rs

      - name: Generate the Windows bundle
        run: |
          set -euo pipefail
          mkdir -p cross
          cat > cross/hello.pengu <<'EOF'
          weave main into int:
            var xs as list of int is [1, 2, 3]
            var total as int is 0
            for x in xs:
              set total is total + x
            return total
          EOF
          python pengu_project.py build --entry cross/hello.pengu \
            --target x86_64-w64-mingw32 --output cross/hello.c
          test -f cross/hello.c
          # The codegen must have produced a Windows bundle; the `when os`
          # environment is NOT changed by --target (docs §7.4), so this only
          # checks the artifact, not the source-level branch.
          grep -q "pengu_main" cross/hello.c

      - name: Cross-compile the generated bundle to a Windows object
        run: |
          set -euo pipefail
          x86_64-w64-mingw32-gcc -c cross/hello.c -o cross/hello.o \
            -I. -Ibuild -Ibuild/include \
            -Wno-error=implicit-function-declaration
          file cross/hello.o | tee cross/hello.o.info
          grep -q "PE32+" cross/hello.o.info

      - name: Link a real PE executable with a MinGW-built ABI shim
        run: |
          set -euo pipefail
          cat > cross/abi_shim.c <<'EOF'
          /* The only runtime symbol a header-only PenguScript program needs.
           * The rest of the runtime is header-only (`static inline`); the archive
           * exists for strings, containers and FFI, whose cross-build is the
           * documented gap. */
          #include "pengu_runtime.h"
          int pengu_abi_version(void) { return PENGU_ABI_VERSION; }
          EOF
          x86_64-w64-mingw32-gcc cross/abi_shim.c cross/hello.o -o cross/hello.exe \
            -I. -Ibuild -Ibuild/include
          file cross/hello.exe | tee cross/hello.exe.info
          grep -q "PE32+" cross/hello.exe.info

      - name: Execute the .exe under Wine
        run: |
          set -euo pipefail
          # The program sums [1,2,3] and returns it, so the exit code is the
          # observable: 6 means the generated code ran on the target platform.
          set +e
          wine64 cross/hello.exe
          rc=$?
          set -e
          echo "wine64 exit code: $rc"
          if [ "$rc" != "6" ]; then
            echo "::error::cross-compiled .exe returned $rc, expected 6"
            exit 1
          fi

      - name: Upload cross artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-compile-${{ github.run_id }}
          path: |
            cross/hello.c
            cross/hello.o
            cross/hello.exe
            cross/*.info
          if-no-files-found: ignore
          retention-days: 14
