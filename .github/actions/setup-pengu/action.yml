name: Setup PenguScript build environment
description: >
  Single source of truth for the CI environment: Python/Node setup, the minimal
  per-OS toolchain, Python packages, the runtime build cache and build_runtime.py.
  Used by ci.yml, release.yml and nightly.yml so a change
  here reaches every workflow (roadmap Fase 7 / CI audit).

inputs:
  python-version:
    description: Python version (pinned patch for reproducibility)
    required: false
    default: '3.14'
  node-version:
    description: Node.js version for the VS Code extension
    required: false
    default: '20'
  build-runtime:
    description: Run build_runtime.py after the cache step
    required: false
    default: 'true'
  runtime-cache-scope:
    description: Extra cache-key discriminator (e.g. 'asan') so sanitizer builds
                 never reuse a plain runtime
    required: false
    default: 'default'
  setup-node:
    description: Install Node.js (only needed for the VSIX job)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Set up Node.js
      if: inputs.setup-node == 'true'
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: vscode-extension/package-lock.json

    # The core runtime has no external C dependencies (libc/libm/pthreads
    # only): satellite bindings bring their own. Keep the system list at the
    # minimum — compiler, CMake and Ninja for the packaging/release paths.
    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential cmake ninja-build gcc

    # No '|| true' here on purpose: a silent Homebrew failure produced confusing
    # downstream errors instead of a clear one.
    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install cmake ninja

    - name: Install Python dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Cache the compiled runtime, not all of build/ (that also holds
    # bundle.c, objects and binaries, which must never be restored).
    - name: Cache runtime build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: |
          build/lib
          build/include
          build/tcc-dist
        key: runtime-${{ inputs.runtime-cache-scope }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('extern_manifest.py', 'build_runtime.py', 'requirements.txt') }}
        restore-keys: |
          runtime-${{ inputs.runtime-cache-scope }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Build C runtime and dependencies
      if: inputs.build-runtime == 'true'
      shell: bash
      run: python build_runtime.py
