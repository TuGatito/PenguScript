[workspace]
resolver = "3"
members = [
    "crates/pengu-sha256",
    "crates/pengu-span",
    "crates/pengu-vfs",
    "crates/pengu-diag",
    "crates/pengu-syntax",
    "crates/pengu-hir",
    "crates/pengu-json",
    "crates/pengu-bindgen",
    "crates/pengu-std",
    "crates/pengu-types",
    "crates/pengu-check",
    "crates/pengu-lir",
    "crates/pengu-codegen",
    "crates/pengu-project",
    "crates/pengu-layout",
    "crates/pengu-fmt",
    "crates/pengu-lint",
    "crates/pengu-lsp",
    "crates/pengu-pkg",
    "crates/pengu-cli",
    "crates/pengu-build",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
