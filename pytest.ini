# Test-suite configuration.
#
# Why this is a separate `pytest.ini` and not `[tool.pytest.ini_options]` in
# `pyproject.toml`: `pytest.ini` is the unambiguous highest-precedence config
# file, so a CI step that passes `-p no:cacheprovider` or `-c` cannot silently
# disagree with the marker registry below. `pyproject.toml` keeps only the ruff
# gate.
#
# Markers are registered AND `--strict-markers` is on, so a typo
# (`@pytest.mark.conformancee`) is an error instead of a silently-ignored
# decorator that makes a test look like it ran. Every marker below is used by
# the batch conformance runner or by the platform-specific gates; adding a test
# to `tests/conformance/` needs no marker at all.

[pytest]
markers =
    smoke: fast, no subprocess, safe to run on every save
    conformance: compiles and runs a .pengu corpus case
    slow: takes over a second, excluded from the smoke set
    windows: only meaningful on Windows
    linux: only meaningful on Linux
    macos: only meaningful on macOS

# `-ra` prints a summary of non-passing tests (skips/xfails included), which is
# what makes a "23 skipped" line auditable instead of invisible.
# `--strict-markers` is the guard described above.
# `-n auto` is part of the default because the suite is dominated by C
# compilations, which are independent: serially it takes ~53 minutes, with one
# worker per logical CPU it takes ~3-4 minutes on a 36-core box (measured
# 195-202s for 1201 tests, including the 55-program conformance corpus, which now runs
# one `pengu run` per program instead of check+build+run). A single file or a
# debugging session can opt out with `-n 0`.
#
# `--dist loadgroup` keeps a `pytest.mark.xdist_group` set on ONE worker while
# everything else spreads as usual. The conformance cases use it, one group per
# collision-free bundle, because a bundle is built by whichever worker first needs
# it: without the grouping every worker that touched a group rebuilt it, and that
# measured as 1207s of aggregate work for a corpus whose bundles cost 84s in total.
# Measured on the full suite: 219s -> 186s. It is deliberately not `--dist
# loadfile`, which puts the 241-test and 156-test documentation sweeps on single
# workers and measured worse, twice (311s, 313s).
addopts = -ra --strict-markers -n auto --dist loadgroup

# `testpaths = tests` keeps a bare `pytest` out of the generated top-level
# `build/`. Defining `norecursedirs` is what makes `tests/build/` collectable:
# pytest's DEFAULT pattern list contains `build`, matched against basenames, so
# `pytest tests` silently skipped `tests/build/test_smart_linking.py` and
# `tests/build/test_build_pengu.py` (the latter only ran because
# `selftest --smoke` passes the marker-selected file paths explicitly). Keep
# `build` out of this list; `test_tests_build_is_collected` guards it.
testpaths = tests
norecursedirs = .* *.egg _darcs CVS dist {arch} *.pyc
